[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claudio-tts"
version = "0.3.0"
description = "Spoken replies for Claude Code, powered by Kokoro. Per-session mute, volume, speed and output devices."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Claudio Restante" }]
keywords = ["claude-code", "tts", "kokoro", "text-to-speech", "accessibility"]
dependencies = [
    "kokoro-onnx>=0.3.9",
    "sounddevice>=0.5.0",
    "numpy>=1.26",
    "mistune>=3.0.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
claudio-tts = "claudio_tts.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claudio_tts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["audio: needs a real audio device (skipped in CI)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/make_player.py" = ["E501"]  # embedded CSS, JS and HTML
